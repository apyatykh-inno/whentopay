<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ремонт: Контроль Грейса</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --text-muted: #8d8d99;
            --accent: #4ea8de;
            --danger: #f72585;
            --warning: #f7b731;
            --success: #4bb543;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 80px; }
        h2 { margin-bottom: 16px; font-weight: 600; font-size: 1.3rem; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Виджет общего долга */
        .summary-card { background: linear-gradient(135deg, #1f2029 0%, #2a2b36 100%); padding: 20px; border-radius: 16px; border: 1px solid #323238; margin-bottom: 24px; text-align: center; }
        .summary-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px; }
        .summary-card h1 { font-size: 2.2rem; color: var(--accent); font-weight: 700; }

        /* Секции и карточки */
        .section { margin-bottom: 24px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 14px; margin-bottom: 10px; border: 1px solid #29292e; }
        
        /* Таймлайн платежей */
        .payment-item { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); padding-left: 10px; }
        .payment-item.status-danger { border-left-color: var(--danger); }
        .payment-item.status-warning { border-left-color: var(--warning); }
        .payment-info h4 { font-size: 1rem; margin-bottom: 2px; }
        .payment-info p { font-size: 0.8rem; color: var(--text-muted); }
        .payment-amount { text-align: right; font-weight: bold; font-size: 1.1rem; }
        .days-left { font-size: 0.75rem; display: block; font-weight: normal; }

        /* Формы */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 12px; background-color: #202024; border: 1px solid #323238; border-radius: 8px; color: var(--text-color); font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        button.btn { background-color: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; }
        button.btn-danger { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; width: auto; font-size: 0.8rem; border-radius: 6px; }

        /* Список карт */
        .card-manage-item { display: flex; justify-content: space-between; align-items: center; }
        
        /* Таблица всех трат */
        .table-container { overflow-x: auto; background-color: var(--card-bg); border-radius: 12px; border: 1px solid #29292e; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #29292e; }
        th { color: var(--text-muted); font-weight: 500; }

        /* Уведомления дней */
        .danger-text { color: var(--danger); }
        .warning-text { color: var(--warning); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <!-- Главный экран: Общий долг -->
        <div class="summary-card">
            <p>Общий долг по всем картам</p>
            <h1 id="total-debt">0 ₽</h1>
        </div>

        <!-- Секция 1: Предстоящие выплаты (Сводный таймлайн) -->
        <div class="section">
            <h2>📅 Ближайшие дедлайны по грейсу</h2>
            <div id="timeline-list"><!-- Рендерится JS --></div>
        </div>

        <!-- Секция 2: Добавить трату -->
        <div class="section card">
            <h2>➕ Новая покупка на ремонте</h2>
            <div class="form-group">
                <label>Выберите карту</label>
                <select id="tx-card"><!-- Заполняется из БД --></select>
            </div>
            <div class="form-group">
                <label>Сумма (₽)</label>
                <input type="number" id="tx-amount" placeholder="0">
            </div>
            <div class="form-group">
                <label>Дата покупки</label>
                <input type="date" id="tx-date">
            </div>
            <button class="btn" onclick="addTransaction()">Записать расход</button>
        </div>

        <!-- Секция 3: Сводная таблица всех трат -->
        <div class="section">
            <h2>📊 Детализация всех расходов</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Карта</th>
                            <th>Сумма</th>
                            <th>Дата покупки</th>
                            <th>Крайний срок</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table-body"><!-- Рендерится JS --></tbody>
                </table>
            </div>
        </div>

        <!-- Секция 4: Управление картами -->
        <div class="section card">
            <h2>💳 Ваши карты и лимиты</h2>
            <div id="cards-manage-list" style="margin-bottom: 15px;"><!-- Рендерится JS --></div>
            
            <h3 style="font-size: 1rem; margin-bottom: 10px; color: var(--text-muted);">Добавить карту</h3>
            <div class="form-group">
                <input type="text" id="card-name" placeholder="Название (например, Альфа Год)">
            </div>
            <div class="form-group">
                <input type="number" id="card-grace" placeholder="Срок грейса (дней, например 365)">
            </div>
            <button class="btn" onclick="addCard()">Создать карту</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
