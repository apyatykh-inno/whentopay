<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whentopay tracking</title>
    
    <!-- Фирменный Favicon Кредитная карта 💳 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
    
    <style>
        :root {
            --bg-color: #f5f6fa;
            --card-bg: #ffffff;
            --text-main: #2f3542;
            --text-muted: #747d8c;
            --primary: #3498db;
            --danger: #e74c3c;
            --warning: #f1c40f;
            --success: #2ecc71;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 15px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1, h2, h3, h4 { margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: rgba(0,0,0,0.02); color: var(--text-muted); }
        
        /* Стилизация компактных кнопок-значков действий */
        .td-actions { display: flex; gap: 6px; justify-content: center; align-items: center; }
        .btn-action { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; transition: background 0.2s; padding: 0; }
        .btn-action:hover { background: #f1f2f6; }
        .edit-icon { color: var(--text-main); }
        .delete-icon { color: var(--danger); background: #fff0f0; border-color: #fcdcdc; }
        .delete-icon:hover { background: var(--danger); color: #fff; }
        
        .btn-danger-card { background: var(--danger); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .status-danger { border-left: 5px solid var(--danger); }
        .status-warning { border-left: 5px solid var(--warning); }
        .danger-text { color: var(--danger); font-weight: bold; }
        .warning-text { color: var(--warning); font-weight: bold; }
        .success-text { color: var(--success); font-weight: bold; }
        .payment-item { display: flex; justify-content: space-between; align-items: center; }
        .days-left { display: block; font-size: 0.8rem; margin-top: 4px; }
        .card-manage-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>whentopay tracking</h1>
        <p>Общий долг по всем картам: <strong id="total-debt">0 ₽</strong></p>
    </div>

    <div class="card">
        <h2>📅 Ближайшие даты и суммы платежей</h2>
        <div id="timeline-list"></div>
    </div>

    <div class="card">
        <h2>➕ Записать новый расход</h2>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <select id="tx-card" style="padding:8px; border-radius:6px;"></select>
            <input type="number" id="tx-amount" placeholder="Сумма (₽)" style="padding:8px; border-radius:6px;">
            <input type="date" id="tx-date" style="padding:8px; border-radius:6px;">
            <button onclick="addTransaction()" style="padding:10px; background:var(--primary); color:#fff; border:none; border-radius:6px; font-weight:bold;">Зафиксировать расход</button>
        </div>
    </div>

    <!-- Восстановлено: Детализация ровно на 4 колонки в шапке -->
    <div class="card" style="overflow-x: auto;">
        <h2>📊 Детализация всех расходов</h2>
        <table>
            <thead>
                <tr>
                    <th>Карта и дата</th>
                    <th>Сумма долга</th>
                    <th>Мин. платеж (до 30-го)</th>
                    <th style="text-align:center;">Действия</th>
                </tr>
            </thead>
            <tbody id="transactions-table-body"></tbody>
        </table>
    </div>

    <!-- Модуль: Отчёт расходов за период -->
    <div class="card" id="report-section">
        <h2>📅 Отчёт расходов за период</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 15px;">
            <input type="date" id="report-start" style="padding:8px; border-radius:6px; border:1px solid #ccc;">
            <input type="date" id="report-end" style="padding:8px; border-radius:6px; border:1px solid #ccc;">
            <button onclick="generateReport()" style="padding:9px 15px; background:var(--primary); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">Сформировать отчёт</button>
        </div>
        <div id="report-result"></div>
    </div>

    <div class="card">
        <h2>💳 Ваши карты и лимиты</h2>
        <div id="cards-manage-list"></div>
        <hr style="border:none; border-top:1px solid #eee; margin:15px 0;">
        <h3>Добавить новую карту в систему</h3>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <input type="text" id="card-name" placeholder="Название банка / карты" style="padding:8px; border-radius:6px;">
            <input type="number" id="card-limit" placeholder="Кредитный лимит карты (₽)" style="padding:8px; border-radius:6px;">
            <input type="number" id="card-grace" placeholder="Срок грейс-периода (дней)" style="padding:8px; border-radius:6px;">
            <select id="card-type" style="padding:8px; border-radius:6px;">
                <option value="purchase">От даты покупки (ВТБ, Альфа, Т-Банк)</option>
                <option value="month">С 1-го числа месяца покупки (Сбербанк)</option>
            </select>
            <button onclick="addCard()" style="padding:10px; background:var(--success); color:#fff; border:none; border-radius:6px; font-weight:bold;">Создать карту</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
