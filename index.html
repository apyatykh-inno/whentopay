<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>whentopay tracking</title>
    
    <!-- Полностью исправленный Favicon кредитной карты -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
    
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --text-muted: #8d8d99;
            --accent: #4ea8de;
            --danger: #f72585;
            --warning: #f7b731;
            --success: #4bb543;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; padding-bottom: 80px; }
        h2 { margin-bottom: 16px; font-weight: 600; font-size: 1.2rem; }
        .container { max-width: 650px; margin: 0 auto; }
        
        .summary-card { background: linear-gradient(135deg, #1f2029 0%, #2a2b36 100%); padding: 20px; border-radius: 16px; border: 1px solid #323238; margin-bottom: 24px; text-align: center; }
        .summary-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 6px; }
        .summary-card h1 { font-size: 2.2rem; color: var(--accent); font-weight: 700; }

        .section { margin-bottom: 24px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 10px; border: 1px solid #29292e; }
        
        .payment-item { display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--accent); padding-left: 12px; }
        .payment-item.status-danger { border-left-color: var(--danger); }
        .payment-item.status-warning { border-left-color: var(--warning); }
        .payment-info h4 { font-size: 1.1rem; margin-bottom: 4px; color: #fff; }
        .payment-info p { font-size: 0.85rem; color: var(--text-muted); line-height: 1.4; }
        .payment-amount { text-align: right; font-weight: bold; font-size: 1.2rem; }
        .days-left { font-size: 0.8rem; display: block; font-weight: normal; margin-top: 6px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        input, select, button { width: 100%; padding: 12px; background-color: #202024; border: 1px solid #323238; border-radius: 8px; color: var(--text-color); font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent); }
        button.btn { background-color: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; }
        
        .btn-action { background-color: transparent; border: 1px solid var(--text-muted); color: var(--text-color); padding: 6px 10px; width: auto; font-size: 0.8rem; border-radius: 6px; cursor: pointer; margin-left: 6px; font-weight: 500; transition: all 0.2s; }
        .btn-action.edit { border-color: var(--warning); color: var(--warning); }
        .btn-action.edit:hover { background-color: rgba(247, 183, 49, 0.1); }
        .btn-action.delete { border-color: var(--danger); color: var(--danger); }
        .btn-action.delete:hover { background-color: rgba(247, 37, 133, 0.1); }
        
        .btn-danger-card { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; width: auto; font-size: 0.8rem; border-radius: 6px; cursor: pointer; }

        .card-manage-item { display: flex; justify-content: space-between; align-items: center; }
        
        .table-container { overflow-x: auto; background-color: var(--card-bg); border-radius: 12px; border: 1px solid #29292e; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; min-width: 600px; }
        th, td { padding: 12px; border-bottom: 1px solid #29292e; vertical-align: middle; }
        th { color: var(--text-muted); font-weight: 500; background-color: #151518; }
        .td-actions { text-align: right; min-width: 170px; }

        .danger-text { color: var(--danger); }
        .warning-text { color: var(--warning); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <div class="summary-card">
            <p>Общий долг по всем картам</p>
            <h1 id="total-debt">0 ₽</h1>
        </div>

        <div class="section">
            <h2>📅 Ближайшие даты и суммы платежей до уплаты процентов</h2>
            <div id="timeline-list"></div>
        </div>
        <div class="section card">
            <h2>➕ Записать новый расход по карте</h2>
            <div class="form-group">
                <label>Выберите карту</label>
                <select id="tx-card"></select>
            </div>
            <div class="form-group">
                <label>Сумма (₽)</label>
                <input type="number" id="tx-amount" placeholder="0">
            </div>
            <div class="form-group">
                <label>Дата покупки</label>
                <input type="date" id="tx-date">
            </div>
            <button class="btn" onclick="addTransaction()">Зафиксировать расход</button>
        </div>

        <div class="section">
            <h2>📊 Детализация всех расходов</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Карта и дата</th>
                            <th>Сумма долга</th>
                            <th>Мин. платеж (до 30-го)</th>
                            <th style="text-align:center;">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Разделено: Отчет вынесен в отдельный независимый блок -->
        <div class="section card" id="report-section">
            <h2>📅 Отчёт расходов за период</h2>
            <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px;">
                <input type="date" id="report-start" style="padding:6px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; font-size:0.85rem;">
                <input type="date" id="report-end" style="padding:6px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; font-size:0.85rem;">
                <button onclick="generateReport()" style="padding:6px 12px; background:#3498db; color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:0.85rem; width:auto;">Создать</button>
            </div>
            <div id="report-result"></div>
        </div>

        <div class="section card">
            <h2>💳 Ваши карты и лимиты</h2>
            <div id="cards-manage-list" style="margin-bottom: 15px;"></div>
            
            <h3 style="font-size: 0.95rem; margin-bottom: 10px; color: var(--text-muted);">Добавить новую карту в систему</h3>
            <div class="form-group">
                <label>Название банка / карты</label>
                <input type="text" id="card-name" placeholder="Например, Сбер 120 или ВТБ">
            </div>
            <div class="form-group">
                <label>Кредитный лимит карты (₽)</label>
                <input type="number" id="card-limit" placeholder="Например, 500000">
            </div>
            <div class="form-group">
                <label>Срок грейс-периода (дней)</label>
                <input type="number" id="card-grace" placeholder="Например, 60 или 120">
            </div>
            <div class="form-group">
                <label>Принцип расчета грейс-периода</label>
                <select id="card-type">
                    <option value="purchase">От даты покупки </option>
                    <option value="month">С 1-го числа месяца покупки </option>
                </select>
            </div>
            <button class="btn" onclick="addCard()">Создать карту</button>
        </div>
    </div>

    <!-- Подключение JS скрипта и закрытие структуры -->
    <script src="script.js"></script>
</body>
</html>
